################################## 玩法指标 ##################################

  level_completion_rate:
    display_name_zh: 关卡通关率
    group: 玩法
    subgroup: 关卡难易度
    definition: 关卡通关总次数/关卡总局数

  avg_level_completion_time:
    display_name_zh: 关卡通关平均时长
    group: 玩法
    subgroup: 关卡难易度
