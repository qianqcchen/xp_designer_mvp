  retention_rate_day_6_unique:
    display_name_zh: 6日留存率_去重
    group: 活跃
    subgroup: 留存
    definition: 用户活跃后第6日活跃用户占比 只统计用户首次命中实验的数据 T+5日活跃人数/T日活跃人数 T日为首次命中实验

  retention_rate_day_7_unique:
    display_name_zh: 7日留存率_去重
    group: 活跃
    subgroup: 留存
    definition: 用户活跃后第7日活跃用户占比 只统计用户首次命中实验的数据 T+6日活跃人数/T日活跃人数 T日为首次命中实验

  retention_rate_day_10_unique:
    display_name_zh: 10日留存率_去重
    group: 活跃
    subgroup: 留存
    definition: 用户活跃后第10日活跃用户占比 只统计用户首次命中实验的数据 T+9日活跃人数/T日活跃人数 T日为首次命中实验

################################## 收入指标 ##################################

  eCPM_interstitial:
    display_name_zh: eCPM_插屏广告
    group: 收入
    subgroup: 插屏广告
    definition: 插屏广告每千次广告展示收入 美元 插屏广告总收入/插屏广告展示次数*1000

  ad_request_completion_rate_interstitial:
    display_name_zh: 广告请求完成率_插屏广告
    group: 收入
    subgroup: 插屏广告
    definition: 插屏广告请求收到回报的占比 插屏广告请求成功+插屏广告请求失败/插屏广告请求总数

  ad_cache_success_rate_interstitial:
    display_name_zh: 广告缓存成功率_插屏广告
    group: 收入
    subgroup: 插屏广告
    definition: 插屏广告缓存池中有广告的概率 插屏广告加载成功数/插屏广告请求总数

  ad_ready_rate_interstitial:
    display_name_zh: 广告就绪率_插屏广告
    group: 收入
    subgroup: 插屏广告
    definition: 插屏广告机会中广告加载成功的概率 插屏广告机会到达且加载成功数/插屏广告机会到达数

  ad_show_success_rate_interstitial:
    display_name_zh: 广告展示成功率_插屏广告
    group: 收入
    subgroup: 插屏广告
    definition: 插屏广告在缓存池ready的情况下调show展示的成功率 插屏广告展示成功次数/插屏广告展示调show次数

  avg_ad_show_count_interstitial:
    display_name_zh: 人均广告展示次数_插屏广告
    group: 收入
    subgroup: 插屏广告
    definition: 平均每人展示插屏广告次数 每天展示插屏广告总次数/DAU

  avg_ad_revenue_interstitial:
    display_name_zh: 人均广告收益_插屏广告
    group: 收入
    subgroup: 插屏广告
    definition: 人均插屏广告收入贡献 美分 总插屏广告收入/总活跃人数
  
  eCPM_rewarded:
