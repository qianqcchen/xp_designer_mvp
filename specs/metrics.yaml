    subgroup: 留存
    definition: 用户活跃后第6日活跃用户占比 不对用户命中实验的次数做去重 T+5日活跃人数/T日活跃人数

  retention_rate_day_7:
    display_name_zh: 7日留存率_不去重
    group: 活跃
    subgroup: 留存
    definition: 用户活跃后第7日活跃用户占比 不对用户命中实验的次数做去重 T+6日活跃人数/T日活跃人数

  retention_rate_day_10:
    display_name_zh: 10日留存率_不去重
    group: 活跃
    subgroup: 留存
    definition: 用户活跃后第10日活跃用户占比 不对用户命中实验的次数做去重 T+9日活跃人数/T日活跃人数

  retention_rate_day_2_unique:
    display_name_zh: 次日留存率_去重
    group: 活跃
    subgroup: 留存
    definition: 用户活跃后第二日活跃用户占比 只统计用户首次命中实验的数据 T+1日活跃人数/T日活跃人数 T日为首次命中实验

  retention_rate_day_3_unique:
